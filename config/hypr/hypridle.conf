general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 120
    on-timeout = sh -c 'brightnessctl -qs && [ "$(brightnessctl -m | awk -F, '\''{gsub(/%/,""); print $4}'\'')" -gt 10 ] && brightnessctl -q set 10%'
    on-resume = brightnessctl -qr
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 720
    on-timeout = hypridle-battery-suspend
}
